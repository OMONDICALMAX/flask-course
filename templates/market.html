<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Market Page</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <main class="container py-5">

        <h1>Welcome to the Market Page of this App</h1>
        <p>This is the Market Page of the Flask App.</p>
     
      <div class="table-responsive">
            <table class="table table-dark table-striped table-hover">
               <thead>
                <tr>
                      <th scope="col">ID</th>
                      <th scope="col">Item Name</th>
                      <th scope="col">Barcode</th>
                      <th scope="col">Price</th>
                      <th scope="col">Options</th>
                </tr>
              </thead>
      

            <tbody>

                {% for item in items %}
                <tr>
                    <th scope="row">{{ item.id }}</th>
                    <td>{{ item.item_name }}</td>
                    <td>{{ item.barcode }}</td>
                    <td>{{ item.price }}</td>
                    <td>
                        <button class="btn btn-outline btn-info">More info</button>
                        <button class="btn btn-outline btn-success">Purchase</button>
                    </td>
                </tr>
                {% endfor %}

            </tbody>
        </table>
      </div>
    </main>

</body>
</html>
